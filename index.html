<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Игротека</title>
  <meta name="description" content="Дурак, морской бой и шахматы с друзьями по ссылке · Durak, Battleship and Chess with friends by link">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%83%8F%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Home: name, game, create or join -->
  <section id="home" class="screen" hidden>
    <div class="panel home-panel">
      <button class="btn ghost small lang-btn corner-btn" data-action="lang" aria-label="Language / Язык">EN</button>
      <h1 class="logo" data-i18n="logo"></h1>
      <p class="sub" data-i18n="tagline"></p>
      <label class="field">
        <span data-i18n="yourName"></span>
        <input id="nameInput" maxlength="16" autocomplete="nickname" data-i18n-ph="namePh">
      </label>
      <div id="inviteBox" class="invite" hidden>
        <p><span data-i18n="invited"></span> <b id="inviteCode"></b></p>
        <button id="acceptInviteBtn" class="btn primary big" data-i18n="enterGame"></button>
      </div>
      <div id="homeActions">
        <fieldset class="game-pick">
          <legend data-i18n="chooseGame"></legend>
          <label class="game-opt">
            <input type="radio" name="gameType" value="durak" checked>
            <span class="game-card"><span class="game-icon">🃏</span><span><b data-i18n="game.durak"></b><small data-i18n="game.durak.sub"></small></span></span>
          </label>
          <label class="game-opt">
            <input type="radio" name="gameType" value="battleship">
            <span class="game-card"><span class="game-icon">🚢</span><span><b data-i18n="game.battleship"></b><small data-i18n="game.battleship.sub"></small></span></span>
          </label>
          <label class="game-opt">
            <input type="radio" name="gameType" value="chess">
            <span class="game-card"><span class="game-icon">♟&#xFE0E;</span><span><b data-i18n="game.chess"></b><small data-i18n="game.chess.sub"></small></span></span>
          </label>
        </fieldset>
        <button id="createBtn" class="btn primary big" data-i18n="createRoom"></button>
        <div class="or"><span data-i18n="or"></span></div>
        <form id="joinForm" class="join-row">
          <input id="codeInput" maxlength="5" data-i18n-ph="codePh" autocomplete="off" spellcheck="false">
          <button class="btn" type="submit" data-i18n="join"></button>
        </form>
      </div>
      <p id="homeError" class="error" hidden></p>
    </div>
  </section>

  <!-- Connecting / errors -->
  <section id="connecting" class="screen" hidden>
    <div class="panel center">
      <div class="spinner" id="connSpinner"></div>
      <p id="connText"></p>
      <p id="connDetail" class="muted small"></p>
      <div class="row">
        <button id="connRetryBtn" class="btn" hidden data-i18n="retry"></button>
        <button id="connBackBtn" class="btn ghost" data-i18n="toHome"></button>
      </div>
    </div>
  </section>

  <!-- Lobby -->
  <section id="lobby" class="screen" hidden>
    <div class="panel lobby-panel">
      <div class="lobby-head">
        <div>
          <p class="muted small" data-i18n="room"></p>
          <p class="code" id="lobbyCode"></p>
          <p class="lobby-game" id="lobbyGame"></p>
        </div>
        <div class="row tight">
          <button class="btn ghost small lang-btn" data-action="lang" aria-label="Language / Язык">EN</button>
          <button class="btn ghost small" data-action="leave" data-i18n="leave"></button>
        </div>
      </div>
      <div class="share">
        <input id="shareLink" readonly>
        <button id="copyBtn" class="btn" data-i18n="copy"></button>
      </div>
      <p class="muted small"><span data-i18n="sendLink"></span> <span id="playersNote"></span></p>
      <ul id="seatList" class="seats"></ul>
      <div class="host-controls">
        <button id="addBotBtn" class="btn" data-i18n="addBot"></button>
      </div>
      <div id="gameSettings"></div>
      <p id="lobbyNet" class="error small" hidden></p>
      <button id="startBtn" class="btn primary big" data-i18n="start"></button>
      <p id="lobbyWait" class="muted center-text" data-i18n="waitHost"></p>
    </div>
  </section>

  <!-- Game -->
  <section id="game" class="screen game" hidden>
    <header class="topbar">
      <button class="btn ghost small" data-action="leave" data-i18n="leave"></button>
      <span class="room-tag"><span data-i18n="room"></span> <b id="gameCode"></b> · <span id="modeTag"></span></span>
      <span class="row tight">
        <button class="btn ghost small lang-btn" data-action="lang" aria-label="Language / Язык">EN</button>
        <button id="chatToggle" class="btn ghost small"><span data-i18n="chat"></span> <span id="chatBadge" class="badge" hidden></span></button>
      </span>
    </header>
    <p id="netBanner" class="net-banner" hidden></p>
    <div id="stage" class="stage"></div>
    <aside id="chat" class="chat">
      <div class="chat-head">
        <b data-i18n="chatTitle"></b>
        <button id="chatClose" class="btn ghost small">✕</button>
      </div>
      <ol id="chatLog" class="chat-log"></ol>
      <form id="chatForm" class="chat-form">
        <input id="chatInput" maxlength="200" data-i18n-ph="chatPh" autocomplete="off">
        <button class="btn small" type="submit">➤</button>
      </form>
    </aside>
    <div id="over" class="over" hidden>
      <div class="panel center">
        <p id="overTitle" class="over-title"></p>
        <p id="overSub" class="muted"></p>
        <table id="scoreTable" class="scores"></table>
        <div id="overHost" class="row">
          <button id="rematchBtn" class="btn primary" data-i18n="rematch"></button>
          <button id="toLobbyBtn" class="btn" data-i18n="toLobby"></button>
        </div>
        <p id="overWait" class="muted small" data-i18n="waitRematch"></p>
        <button id="overHideBtn" class="btn ghost small" data-i18n="viewBoard"></button>
      </div>
    </div>
  </section>

  <div id="toast" class="toast" hidden></div>

  <script src="vendor/peerjs.min.js"></script>
  <script src="i18n.js"></script>
  <script src="common.js"></script>
  <script src="durak.js"></script>
  <script src="battleship.js"></script>
  <script src="chess.js"></script>
  <script src="ui-durak.js"></script>
  <script src="ui-battleship.js"></script>
  <script src="ui-chess.js"></script>
  <script src="app.js"></script>
</body>
</html>
